name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/parse-check.mjs
      - run: node scripts/hull-repro.mjs
      - run: node scripts/navmesh-repro.mjs
      - run: node scripts/roadpath-repro.mjs
      - run: npm run build
