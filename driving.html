<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTATHENS — Driving Test Scene</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; width: 100%; }
      #root { width: 100%; height: 100%; }
      #hud { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: #fff; font-family: 'Courier New', monospace; font-size: 14px; letter-spacing: 2px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); z-index: 10; pointer-events: none; }
      #tip { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); color: #fff; font-family: 'Courier New', monospace; font-size: 12px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); z-index: 10; pointer-events: none; opacity: 0.85; }
      #note { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); color: #ffd700; font-family: 'Courier New', monospace; font-size: 12px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); z-index: 10; pointer-events: none; opacity: 0.7; }
    </style>
    
    
  </head>
  <body>
    <div id="root"></div>
    <div id="hud">🚗 DRIVING TEST</div>
    <div id="tip">W/S — accelerate / brake · A/D — steer · F — enter / exit · mouse drag — look · 1/2/3 — camera · V — cycle · G — colliders</div>
    <div id="note">On foot: WASD walk (Shift run) · walk to a car and press F · QA: __gtathensTp(x,z,yaw), __gtathensCars.driving()</div>
    <script type="module" src="/src/driving/main.jsx"></script>
  </body>
</html>
